# This repository's settings for the sader skills. The keys are defined by
# ~/.claude/rules/sader-process-standard.md.

platforms = ["linux", "windows"]

# Every card gets the prototype checks, except one that changes a [[guarded]] path, which runs at
# gold.
tier = "prototype"

# The app holds the user's GitHub OAuth token with the repo scope, so a leak is a High rating.
# The reader check is guarded too, because it is the only check on a file calling the credential store crate itself (#54).
[[guarded]]
id = "token"
rule = "The OAuth token never reaches the interface, a log line or anywhere but the OS credential store and GitHub's API."
points = ["AccessToken: no Serialize, Debug that hides the value", "store_token", "GitHub::sign_in", "GitHub::send", "check-token-readers.sh: the credential store crate in no file but the five it lists"]
paths = ["crates/core/src/token.rs", "crates/core/src/auth.rs", "crates/core/src/github.rs", "tools/check-token-readers.sh"]

# CLAUDE.md, Commands, gives each check's prerequisites. The first seven mirror ci.yml's steps.

[[pre_push]]
command = "cargo fmt --check"

[[pre_push]]
command = "cargo clippy -p git-viewme-core"

[[pre_push]]
command = "cargo test -p git-viewme-core"

# Only token.rs uses the credential store crate, the one reader of the token the compiler cannot stop, so a
# new one elsewhere fails here instead of passing at prototype with no security review.
[[pre_push]]
command = "bash tools/check-token-readers.sh"
shell = "bash"

[[pre_push]]
command = "npm ci"

[[pre_push]]
command = "npm run check"

[[pre_push]]
command = "npm test"

# CI leaves src-tauri out, and on Linux it needs the WebKitGTK system packages.
[[pre_push]]
command = "cargo clippy -p git-viewme"
platforms = ["windows"]

# The "CI until release" section of git-viewme/prototype-spec.md (sadermine/project-documentation)
# chooses this deviation.
[ci]
deviations = ["non-dotnet-checks"]
