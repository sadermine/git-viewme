# This repository's settings for the sader skills. The keys are defined by
# ~/.claude/rules/sader-process-standard.md.

# git-viewme has no GitHub Projects board yet.
board = false
platforms = ["linux", "windows"]

# Every card gets the prototype checks, except one that changes a [[guarded]] path, which runs at
# gold. Don H approved both on 2026-11-06 (sadermine/git-viewme #2).
tier = "prototype"

# The app holds the user's GitHub OAuth token with the repo scope, so a leak is a High rating.
[[guarded]]
id = "token"
rule = "The OAuth token never reaches the interface, a log line or anywhere but the OS credential store and GitHub's API."
points = ["AccessToken: no Serialize, Debug that hides the value", "store_token", "GitHub::sign_in", "GitHub::send"]
paths = ["crates/core/src/token.rs", "crates/core/src/auth.rs", "crates/core/src/github.rs"]

# CLAUDE.md, Commands, gives each check's prerequisites. The first five mirror ci.yml's steps.

[[pre_push]]
command = "cargo fmt --check"

[[pre_push]]
command = "cargo clippy -p git-viewme-core"

[[pre_push]]
command = "cargo test -p git-viewme-core"

[[pre_push]]
command = "npm ci"

[[pre_push]]
command = "npm run check"

# CI leaves src-tauri out, and on Linux it needs the WebKitGTK system packages.
[[pre_push]]
command = "cargo clippy -p git-viewme"
platforms = ["windows"]

# The prototype spec's "CI until release" section chooses this deviation. The pull request that
# adds this table records Don's approval (sader-process standard, rule 1).
[ci]
deviations = ["non-dotnet-checks"]
