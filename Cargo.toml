[workspace]
members = ["crates/core"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
