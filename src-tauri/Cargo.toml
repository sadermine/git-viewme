[package]
name = "git-viewme"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
# The suffix keeps the lib name apart from the bin name; on Windows they collide (rust-lang/cargo#8519).
name = "git_viewme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
git-viewme-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[lints]
workspace = true
