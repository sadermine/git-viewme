[package]
name = "git-viewme-core"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
httpdate = "1.0.3"
humantime = "2.3.0"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time"] }

[lints]
workspace = true

